name: Diagnóstico de las páginas publicadas

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir las páginas y registrar errores
        run: |
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install --with-deps chromium >/dev/null 2>&1
          mkdir shots
          cat > t.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch({args:['--use-gl=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
          const urls=['https://www.gpworx.com/design','https://www.gpworx.com/designer/','https://www.gpworx.com/designer/coloplasteau27/','https://www.gpworx.com/designer/coloplasteau27/edit.html'];
          let i=0;for(const url of urls){for(const dev of ['desk','phone']){i++;
            const ctx=await b.newContext(dev==='desk'?{viewport:{width:1300,height:850}}:devices['iPhone 13']);const p=await ctx.newPage();const log=[];
            p.on('pageerror',e=>log.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')log.push('CONSOLE '+m.type()+' '+m.text())});
            p.on('requestfailed',r=>log.push('FAILED '+r.url()+' '+(r.failure()||{}).errorText));
            p.on('response',r=>{if(r.status()>=400||/\.(js|css)/.test(r.url()))log.push(r.status()+' '+r.url());});
            try{await p.goto(url,{waitUntil:'load',timeout:60000});}catch(e){log.push('GOTO '+e.message);}
            await p.waitForTimeout(7000);
            const st=await p.evaluate(()=>({url:location.href,canvas:!!document.querySelector('canvas'),w:(document.querySelector('canvas')||{}).width,markers:document.querySelectorAll('#markers .mk').length,legend:document.querySelectorAll('#legend li').length,shot:(document.getElementById('shotBtn')||{}).hidden})).catch(e=>({err:e.message}));
            await p.screenshot({path:`shots/${i}-${dev}.png`});
            console.log('==== '+url+' ['+dev+'] '+JSON.stringify(st)+'\n'+log.join('\n'));await ctx.close();}}
          await b.close();})();
          JS
          node t.js
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
