name: Diagnóstico Coloplast

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir Coloplast publicado
        run: |
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install --with-deps chromium webkit >/dev/null 2>&1
          cat > t.js <<'JS'
          const pw=require('playwright');(async()=>{
          for(const eng of ['chromium','webkit']){const b=await pw[eng].launch(eng==='chromium'?{args:['--use-gl=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']}:{});
          for(const url of ['https://www.gpworx.com/designer/coloplasteau27/','https://www.gpworx.com/designer/coloplasteau27/edit.html','https://www.gpworx.com/designer/coloplasteau27']){
            const ctx=await b.newContext({viewport:{width:1300,height:850}});const p=await ctx.newPage();const log=[];
            p.on('pageerror',e=>log.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error')log.push('CONSOLE '+m.text())});
            p.on('response',r=>{if(r.status()>=300)log.push(r.status()+' '+r.url()+' '+(r.headers()['location']||''));});
            try{await p.goto(url,{waitUntil:'load',timeout:60000});}catch(e){log.push('GOTO '+e.message);}
            await p.waitForTimeout(6000);
            const st=await p.evaluate(()=>({url:location.href,markers:document.querySelectorAll('#markers .mk').length,err:(document.querySelector('.gp-err')||{}).textContent||'',scripts:[...document.scripts].map(s=>s.src.replace(location.origin,''))})).catch(e=>({e:e.message}));
            console.log('==== '+eng+' '+url+'\n'+JSON.stringify(st)+'\n'+log.join('\n'));await ctx.close();}
          await b.close();}})();
          JS
          node t.js
