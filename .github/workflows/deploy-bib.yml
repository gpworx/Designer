name: Publicar la biblioteca en gpworx.com/designer/bib

# Sube solo la biblioteca (site/library/) a designer/bib/: pestañas Elementos / Texturas.
# No toca gpworx.com/designer ni gpworx.com/design.
on:
  push:
    branches: [biblioteca-elementos]
    paths: ['site/library/**', '.github/workflows/deploy-bib.yml']
  workflow_dispatch:

concurrency:
  group: deploy-hostalia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Subir site/library/ por FTP a gpworx.com/designer/bib
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/library/
          server-dir: designer/bib/
