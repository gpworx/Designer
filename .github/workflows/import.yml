name: Importar configurador desde el servidor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostalia
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Descargar httpdocs/designer a site/
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          rm -rf site && mkdir site
          lftp -u "$U","$P" "$S" -e "set ftp:ssl-allow no; mirror --verbose --exclude-glob .ftp-deploy-sync-state.json designer ./site; quit"
          echo "Archivos descargados:"; find site -type f | head -100
          test -n "$(ls -A site)" || { echo "No se ha descargado nada; no se modifica el repo"; exit 1; }

      - name: Borrar la carpeta sobrante httpdocs/designer (solo los 2 archivos de prueba)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U","$P" "$S" -e "set ftp:ssl-allow no; set cmd:fail-exit no; rm httpdocs/designer/index.html; rm httpdocs/designer/.ftp-deploy-sync-state.json; rmdir httpdocs/designer; rmdir httpdocs; quit" || true

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Importar el configurador publicado en gpworx.com/designer" || echo "Sin cambios"
          git push
