name: Traer logo desde el servidor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar assets/images y descargar logos
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null 2>&1
          ftp(){ lftp -u "$U","$P" "$S" -e "set ftp:ssl-allow no; $1; quit"; }
          ftp "cls -1 assets/images/" > list.txt 2>&1 || true
          cat list.txt
          mkdir -p logo-src
          grep -iE 'vctr|vector|communication|logo' list.txt | head -20 | while read f; do ftp "get \"$f\" -o \"logo-src/$(basename "$f")\"" || true; done
          ls -la logo-src
      - name: Guardar en una rama aparte
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b logo-import && git add -f logo-src list.txt && git commit -qm "Logo desde el servidor" && git push -qf origin logo-import
