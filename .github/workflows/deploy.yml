name: Publicar en gpworx.com/designer

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: deploy-hostalia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar configuración de correo (desde los secretos)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            php -r 'echo "<?php return ".var_export(["host"=>getenv("SMTP_HOST"),"user"=>getenv("SMTP_USER"),"pass"=>getenv("SMTP_PASSWORD")],true).";\n";' > site/mail-config.php
            echo "mail-config.php generado"
          fi

      - name: Subir la carpeta site/ por FTP a gpworx.com/designer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: designer/
