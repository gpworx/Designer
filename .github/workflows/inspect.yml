name: Inspeccionar envío de correo de la web

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar los scripts PHP de correo de la web (sin mostrar contraseñas)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null 2>&1
          mkdir w && cd w
          lftp -u "$U","$P" "$S" -e "set ftp:ssl-allow no; mirror --include-glob '*.php' --exclude designer/ --exclude wp-content/uploads/ --exclude wp-includes/ --exclude wp-admin/ --no-empty-dirs . .; quit" >/dev/null 2>&1 || true
          echo "PHP encontrados: $(find . -name '*.php' | wc -l)"
          grep -rlI -E "mail\(|PHPMailer|smtp|SMTP" --include='*.php' . | head -30
          echo "----- líneas relevantes (contraseñas ocultas) -----"
          grep -rnI -E "mail\(|PHPMailer|->Host|->Port|->Username|->SMTPSecure|From|info@|servidor-correo|smtp" --include='*.php' . \
            | grep -viE "pass|pwd|clave|contrase" | cut -c1-220 | head -60
