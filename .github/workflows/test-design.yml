name: Probar captura desde gpworx.com/design

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir la web real y pulsar el botón de captura
        run: |
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({args:['--use-gl=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
          for(const url of ['https://www.gpworx.com/design','https://www.gpworx.com/design/','https://www.gpworx.com/designer/']){
            const p=await b.newPage({viewport:{width:1300,height:850}});const log=[];
            p.on('pageerror',e=>log.push('PAGEERROR '+e.message));p.on('console',m=>{if(m.type()==='error')log.push('CONSOLE '+m.text())});
            p.on('requestfailed',r=>log.push('FAILED '+r.url()+' '+(r.failure()||{}).errorText));
            p.on('response',async r=>{if(/send\.php|\.js|\.css/.test(r.url()))log.push(r.status()+' '+r.request().method()+' '+r.url()+(/send\.php/.test(r.url())?' -> '+(await r.text().catch(()=>'')).slice(0,200):''));});
            try{await p.goto(url,{waitUntil:'load',timeout:60000});}catch(e){log.push('GOTO '+e.message);}
            await p.waitForTimeout(6000);log.push('final URL '+p.url());
            try{await p.click('#shotBtn',{timeout:10000});await p.waitForTimeout(15000);log.push('MSG '+await p.textContent('#shotMsg'));}catch(e){log.push('CLICK '+e.message);}
            console.log('==== '+url+'\n'+log.join('\n'));await p.close();}
          await b.close();})();
          JS
          node t.js
